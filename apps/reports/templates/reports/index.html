<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Hisobotlar - Excel</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f2f5fa; margin:0; }
  .top { background:#1f3c68; color:#fff; padding:16px 28px; font-size:18px; font-weight:600; }
  .wrap { max-width: 900px; margin: 40px auto; padding: 0 20px; }
  h1 { color:#1f3c68; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:18px; margin-top:24px; }
  .card { background:#fff; border-radius:12px; padding:24px; text-align:center;
          box-shadow:0 2px 10px rgba(31,60,104,.12); text-decoration:none; color:#1f3c68; }
  .card:hover { transform: translateY(-3px); box-shadow:0 6px 18px rgba(31,60,104,.2); }
  .card .ico { font-size:40px; }
  .card .t { margin-top:10px; font-weight:600; }
  .card .d { margin-top:6px; font-size:13px; color:#67748c; }
</style>
</head>
<body>
<div class="top">📊 CPK Center - Hisobotlar (Excel)</div>
<div class="wrap">
  <h1>Bir tugma bilan hisobot yuklab olish</h1>
  <div class="grid">
    <a class="card" href="{% url 'reports:students_excel' %}">
      <div class="ico">🎓</div><div class="t">Tinglovchilar</div>
      <div class="d">Guruhlar, baholar, telefonlar</div>
    </a>
    <a class="card" href="{% url 'reports:certificates_excel' %}">
      <div class="ico">📜</div><div class="t">Sertifikatlar</div>
      <div class="d">Reyestr, holatlar, QR kodlar</div>
    </a>
    <a class="card" href="{% url 'reports:schedule_excel' %}">
      <div class="ico">📅</div><div class="t">Dars jadvali</div>
      <div class="d">Sana, vaqt, guruh, ma'ruzachi</div>
    </a>
    <a class="card" href="{% url 'reports:lecturers_excel' %}">
      <div class="ico">👨‍🏫</div><div class="t">Ma'ruzachilar</div>
      <div class="d">Mutaxassislik, tajriba</div>
    </a>
  </div>
</div>
</body>
</html>
