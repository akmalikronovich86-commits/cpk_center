<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Natija</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#f2f5fa; margin:0; padding:30px; }
  .card { max-width:500px; margin:30px auto; background:#fff; padding:30px;
          border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); text-align:center; }
  .success { background:#d4edda; color:#155724; padding:20px; border-radius:8px; }
  .error { background:#f8d7da; color:#721c24; padding:20px; border-radius:8px; }
  .warning { background:#fff3cd; color:#856404; padding:20px; border-radius:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="{{ status }}">
    <h1>{% if status == 'success' %}✅{% elif status == 'error' %}❌{% else %}⚠️{% endif %} Natija</h1>
    <p>{{ message }}</p>
    {% if schedule %}<p><b>{{ schedule }}</b></p>{% endif %}
  </div>
</div>
</body>
</html>
