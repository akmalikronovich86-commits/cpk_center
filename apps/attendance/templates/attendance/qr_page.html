<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Davomat QR-kodi</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; background:#f2f5fa; margin:0; }
  .top { background:#1f3c68; color:#fff; padding:14px 28px; font-weight:600;
         display:flex; justify-content:space-between; align-items:center; }
  .back { color:#fff; text-decoration:none; background:rgba(255,255,255,.15);
          padding:8px 18px; border-radius:8px; }
  .wrap { max-width:500px; margin:30px auto; background:#fff; padding:30px;
          border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); text-align:center; }
  h1 { color:#1f3c68; font-size:20px; }
  .info { color:#67748c; font-size:14px; margin-bottom:20px; }
  .qr { max-width:300px; border:8px solid #fff; box-shadow:0 0 20px rgba(31,76,120,.3); }
  .timer { margin-top:20px; padding:10px; background:#fff3cd; border-radius:8px;
           color:#856404; font-weight:600; }
  .note { margin-top:15px; font-size:13px; color:#67748c; }
</style>
</head>
<body>
<div class="top">
  <span>📱 Davomat QR-kodi</span>
  <a class="back" href="javascript:history.back()">⬅️ Ortga</a>
</div>
<div class="wrap">
  <h1>{{ schedule }}</h1>
  <div class="info">Talabalar telefonda bu QR-kodni skanerlashadi</div>
  <img class="qr" src="data:image/png;base64,{{ qr_b64 }}" alt="QR">
  <div class="timer">⏰ QR-kod {{ minutes_left }} daqiqa amal qiladi</div>
  <div class="note">💡 Eslatma: Davomatni boshlash uchun faqat shu dars o'qituvchisi
    QR-kodni skanerlab, "Darsni boshlash" tugmasini bosishi kerak.</div>
</div>
</body>
</html>
