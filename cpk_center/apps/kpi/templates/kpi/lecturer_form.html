{% extends "certificates/base_student.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<a href="javascript:history.back()" style="display: inline-flex; align-items: center; gap: 8px; color: #4a5568; text-decoration: none; font-weight: 600; margin-bottom: 15px; padding: 8px 16px; background: #f7fafc; border-radius: 8px; border: 1px solid #e2e8f0; transition: all 0.2s;" onmouseover="this.style.background='#edf2f7'" onmouseout="this.style.background='#f7fafc'">️ Ortga</a>

<div style="padding: 30px; max-width: 800px; margin: 0 auto;">
    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <h2 style="color: #1e3a5f; margin-bottom: 20px;">{{ title }}</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #2d3748;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color: #e53e3e; font-size: 12px; margin-top: 5px;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" style="background: #2c5282; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">💾 Saqlash</button>
                <a href="{% url 'kpi:lecturer_list' %}" style="background: #718096; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">❌ Bekor qilish</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
