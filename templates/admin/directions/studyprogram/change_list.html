{% extends "admin/change_list.html" %}

{% block result_list %}
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📋 Ustun qo'shilmoqda T/R...');
        
        // T/R sarlavhasini qo'shish
        var thead = document.querySelector('#result_list thead tr');
        if (thead) {
            var th = document.createElement('th');
            th.scope = 'col';
            th.textContent = 'T/R';
            th.style.cssText = 'width: 50px; text-align: center;';
            thead.insertBefore(th, thead.firstChild);
        }
        
        // Qatorlarga tartib raqamlarini qo'shish
        var tbody = document.querySelector('#result_list tbody');
        if (tbody) {
            var rows = tbody.querySelectorAll('tr');
            rows.forEach(function(row, index) {
                var td = document.createElement('td');
                td.textContent = index + 1;
                td.style.cssText = 'text-align: center; color: #666; font-weight: 500;';
                row.insertBefore(td, row.firstChild);
            });
            console.log('✅ T/R добавлен:', rows.length, 'строк');
        }
    });
    </script>
    {{ block.super }}
{% endblock %}
